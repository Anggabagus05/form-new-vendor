<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d5dbe3;--ac:#1f5fbf;--acx:#fff;--er:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181e;--card:#1d232b;--tx:#e8ecf1;--mu:#9aa7b6;--bd:#34404d;--ac:#6fa3f0;--acx:#10151b;--er:#ff7b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181e;--card:#1d232b;--tx:#e8ecf1;--mu:#9aa7b6;--bd:#34404d;--ac:#6fa3f0;--acx:#10151b;--er:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0}.sub{color:var(--mu);margin:2px 0 4px}.sub b{color:var(--ac)}
.note{color:var(--mu);font-size:.9rem;margin:0 0 16px}
fieldset{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 16px 16px;margin:0 0 16px}
legend{font-weight:600;padding:0 6px}
label{display:block;font-size:.9rem;margin:12px 0 4px}.req:after{content:" *";color:var(--er)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.bad{border-color:var(--er)}.err{color:var(--er);font-size:.8rem;margin-top:2px}
.hint{color:var(--mu);font-size:.8rem}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:.95rem}.chk input{width:auto;margin-top:5px}
button{font:inherit;background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:.85rem;max-height:360px;overflow:auto}
.kop{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin:0 0 18px;text-align:center}.kop img{display:block;max-width:100%;height:auto;max-height:64px;margin:0 auto}</style></head><body><main>
